version: 2
updates:
  # npm workspaces monorepo (client, server, packages/shared) — a single
  # root entry is correct here: Dependabot reads the root package.json's
  # "workspaces" field and resolves all three workspaces from the one
  # root package-lock.json. Do NOT add separate /client or /server entries;
  # that would have Dependabot try (and fail) to resolve them as standalone
  # projects with no lockfile of their own.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Africa/Lagos"

    # Cooldown: wait 7 days after a new version is published before opening
    # a PR. This allows the community to surface supply-chain issues or
    # regressions in new releases before we automatically pull them in.
    cooldown:
      default-days: 7

    open-pull-requests-limit: 10

    labels:
      - "dependencies"
      - "security"

    commit-message:
      prefix: "deps"

    groups:
      production-dependencies:
        dependency-type: "production"

      development-dependencies:
        dependency-type: "development"

  # GitHub Actions workflow dependencies themselves
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "Africa/Lagos"

    # Cooldown: same 7-day hold — action updates can introduce malicious
    # code; community vetting time is valuable here especially.
    cooldown:
      default-days: 7

    open-pull-requests-limit: 5

    labels:
      - "dependencies"
      - "security"

    commit-message:
      prefix: "ci"

  # Docker base image used in server/Dockerfile
  - package-ecosystem: "docker"
    directory: "/server"
    schedule:
      interval: "weekly"
      day: "monday"

    # Cooldown: 7-day hold for Docker base images as well.
    cooldown:
      default-days: 7

    labels:
      - "docker"
      - "security"
