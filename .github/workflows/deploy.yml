name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  AWS_ACCOUNT_ID: "666036096298"
  ECR_REGISTRY: 666036096298.dkr.ecr.eu-west-1.amazonaws.com
  BACKEND_REPOSITORY: secure-lms-backend
  FRONTEND_REPOSITORY: secure-lms-frontend
  EC2_INSTANCE_ID: i-0db943f6c525965c1

jobs:

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: arn:aws:iam::666036096298:role/SecureLMS-GitHubActions-Role
          aws-region: eu-west-1

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@aded0d722166a37980e030aa969dda0bfe6b6947

      - name: Build backend image
        run: |
          set -euo pipefail

          docker build \
            -f server/Dockerfile \
            -t "${ECR_REGISTRY}/${BACKEND_REPOSITORY}:${GITHUB_SHA}" \
            .

      - name: Build frontend image
        run: |
          set -euo pipefail

          docker build \
            --build-arg NEXT_PUBLIC_API_URL=/api \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET="${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID="${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}" \
            --build-arg NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY="${{ vars.NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY }}" \
            -f client/Dockerfile \
            -t "${ECR_REGISTRY}/${FRONTEND_REPOSITORY}:${GITHUB_SHA}" \
            .

      - name: Push backend image
        run: |
          set -euo pipefail

          docker push \
            "${ECR_REGISTRY}/${BACKEND_REPOSITORY}:${GITHUB_SHA}"

      - name: Push frontend image
        run: |
          set -euo pipefail

          docker push \
            "${ECR_REGISTRY}/${FRONTEND_REPOSITORY}:${GITHUB_SHA}"

      - name: Verify backend image in ECR
        run: |
          aws ecr describe-images \
            --region "${AWS_REGION}" \
            --repository-name "${BACKEND_REPOSITORY}" \
            --image-ids imageTag="${GITHUB_SHA}"

      - name: Verify frontend image in ECR
        run: |
          aws ecr describe-images \
            --region "${AWS_REGION}" \
            --repository-name "${FRONTEND_REPOSITORY}" \
            --image-ids imageTag="${GITHUB_SHA}"

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: arn:aws:iam::666036096298:role/SecureLMS-GitHubActions-Role
          aws-region: eu-west-1

      - name: Deploy through AWS SSM
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --region "${AWS_REGION}" \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Secure LMS deployment ${IMAGE_TAG}" \
            --timeout-seconds 900 \
            --parameters "commands=[
              \"set -eu\",
              \"cd /home/ubuntu/secure-lms-mvp\",
              \"export IMAGE_TAG=${IMAGE_TAG}\",
              \"echo '=== Secure LMS deployment ==='\",
              \"echo 'IMAGE_TAG=${IMAGE_TAG}'\",
              \"echo '=== Disk usage before deployment ==='\",
              \"df -h /\",
              \"echo '=== Docker disk usage before deployment ==='\",
              \"docker system df\",
              \"echo '=== Logging into Amazon ECR ==='\",
              \"aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}\",
              \"echo '=== Pulling backend image ==='\",
              \"docker pull ${ECR_REGISTRY}/${BACKEND_REPOSITORY}:${IMAGE_TAG}\",
              \"echo '=== Pulling frontend image ==='\",
              \"docker pull ${ECR_REGISTRY}/${FRONTEND_REPOSITORY}:${IMAGE_TAG}\",
              \"echo '=== Starting application ==='\",
              \"docker compose -f docker-compose.prod.yml up -d --no-build\",
              \"echo '=== Container status ==='\",
              \"docker compose -f docker-compose.prod.yml ps\",
              \"echo '=== Waiting for application ==='\",
              \"sleep 15\",
              \"echo '=== Application health check ==='\",
              \"curl -fsS http://localhost/ > /dev/null\",
              \"echo 'Application health check passed'\",
              \"echo '=== Cleaning unused Docker resources ==='\",
              \"docker image prune -af --filter 'until=168h' || true\",
              \"docker builder prune -af --filter 'until=168h' || true\",
              \"echo '=== Disk usage after deployment ==='\",
              \"df -h /\",
              \"echo '=== Docker disk usage after deployment ==='\",
              \"docker system df\",
              \"echo 'Deployment completed successfully'\"
            ]" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: ${COMMAND_ID}"
          echo "COMMAND_ID=${COMMAND_ID}" >> "$GITHUB_ENV"

      - name: Wait for deployment
        run: |
          set -euo pipefail

          aws ssm wait command-executed \
            --region "${AWS_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}"

      - name: Check deployment result
        run: |
          set -euo pipefail

          STATUS=$(aws ssm get-command-invocation \
            --region "${AWS_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query 'Status' \
            --output text)

          echo "Deployment status: ${STATUS}"

          if [ "${STATUS}" != "Success" ]; then
            echo "Deployment failed."

            echo
            echo "===== STDOUT ====="
            aws ssm get-command-invocation \
              --region "${AWS_REGION}" \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query 'StandardOutputContent' \
              --output text

            echo
            echo "===== STDERR ====="
            aws ssm get-command-invocation \
              --region "${AWS_REGION}" \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query 'StandardErrorContent' \
              --output text

            exit 1
          fi

      - name: Show deployment output
        run: |
          aws ssm get-command-invocation \
            --region "${AWS_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query 'StandardOutputContent' \
            --output text
