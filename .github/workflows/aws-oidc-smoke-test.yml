name: AWS OIDC Smoke Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  verify-aws-oidc:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::666036096298:role/SecureLMS-GitHubActions-Role
          aws-region: eu-west-1

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Verify ECR access
        run: |
          aws ecr describe-repositories \
            --region eu-west-1 \
            --repository-names \
              secure-lms-backend \
              secure-lms-frontend
