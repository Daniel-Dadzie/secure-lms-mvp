name: AWS OIDC Smoke Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  verify-aws-oidc:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: arn:aws:iam::666036096298:role/SecureLMS-GitHubActions-Role
          aws-region: eu-west-1

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Verify ECR access
        run: |
          aws ecr describe-repositories \
            --region eu-west-1 \
            --repository-names \
              secure-lms-backend \
              secure-lms-frontend

      - name: Verify SSM access
        shell: bash
        run: |
          set -euo pipefail

          INSTANCE_ID="i-0db943f6c525965c1"

          COMMAND_ID="$(
            aws ssm send-command \
              --region eu-west-1 \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters 'commands=["echo Secure LMS SSM connectivity test successful"]' \
              --query "Command.CommandId" \
              --output text
          )"

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --region eu-west-1 \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          STATUS="$(
            aws ssm get-command-invocation \
              --region eu-west-1 \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text
          )"

          echo "SSM command status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            echo "SSM command failed."
            exit 1
          fi

          aws ssm get-command-invocation \
            --region eu-west-1 \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text
