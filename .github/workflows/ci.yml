name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: secure_lms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/secure_lms_test
      JWT_ACCESS_SECRET: ci-test-access-secret-not-for-production
      JWT_REFRESH_SECRET: ci-test-refresh-secret-not-for-production
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      NODE_ENV: test
      CLIENT_URL: http://localhost:3000

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: "npm"

      - name: Configure test environment
        shell: bash
        run: |
          set -euo pipefail

          ACCESS_SECRET="$(openssl rand -hex 64)"
          REFRESH_SECRET="$(openssl rand -hex 64)"

          echo "::add-mask::$ACCESS_SECRET"
          echo "::add-mask::$REFRESH_SECRET"
          echo "::add-mask::$DATABASE_URL"

          {
            echo "JWT_ACCESS_SECRET=$ACCESS_SECRET"
            echo "JWT_REFRESH_SECRET=$REFRESH_SECRET"
            echo "JWT_ACCESS_EXPIRES_IN=15m"
            echo "JWT_REFRESH_EXPIRES_IN=7d"
            echo "NODE_ENV=test"
            echo "CLIENT_URL=http://localhost:3000"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci --fetch-retries=5 --fetch-retry-factor=2 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000

      - name: Lint
        run: npm run lint --workspaces --if-present

      - name: Generate Prisma Client
        run: npx prisma generate --config prisma.config.ts
        working-directory: server

      - name: Sync Database Schema
        run: npx prisma db push
        working-directory: server
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/secure_lms_test

      - name: Build
        run: npm run build --workspaces --if-present

      - name: Run tests
        run: npm run test --workspaces --if-present

      - name: Dependency vulnerability scan
        run: npm audit --audit-level=critical
        continue-on-error: true